name: bani-suef-suitability
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  # Scientific
  - numpy>=1.26
  - pandas>=2.2
  - scipy>=1.12
  - scikit-learn>=1.4
  - matplotlib>=3.8
  - seaborn>=0.13
  # Geospatial
  - geopandas>=0.14
  - shapely>=2.0
  - rasterio>=1.3
  - pyogrio>=0.7
  - fiona>=1.9
  - pyproj>=3.6
  - rioxarray>=0.15
  - xarray>=2024.1
  - gdal
  # Utility
  - tqdm>=4.66
  - joblib>=1.3
  - pyyaml>=6.0
  - openpyxl>=3.1
  - xlrd>=2.0
  # Notebook
  - jupyter
  - notebook
  - ipykernel
  - pillow
  # PyPI-only
  - pip:
      - quantile-forest>=1.3
      - pykrige>=1.7
      - earthengine-api>=0.1.395
      - geemap>=0.32
